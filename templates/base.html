<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Your Custom CSS (Make sure to move these to static/css/) -->
    <link rel="stylesheet" href="/static/css/font.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/base.css">

    <!-- Tailwind & DaisyUI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

    <!-- Global JS -->
    <script src="/static/js/script.js?v=1" defer></script>

    <title>{% block title %}What If I Invest?{% endblock %}</title>
</head>

<body class="w-screen min-h-dvh relative overflow-x-hidden">
    <main class="w-full flex h-screen overflow-hidden relative text-sm">
        <!-- 1. MOBILE HAMBURGER BUTTON  -->
        <!-- Added a red background just so you can see it clearly during debugging -->
        <button id="mobile-menu-btn"
            class="md:hidden fixed top-3 left-3 z-50 p-2 bg-stone-200 text-white rounded-lg shadow-md cursor-pointer">
            <img src="/static/assets/svg/chart.svg" alt="" class="w-5 h-5">
        </button>

        <!-- 2. SIDEBAR -->
        <aside id="app-sidebar"
            class="fixed md:relative inset-y-0 left-0 z-40 w-[280px] max-w-[80%] h-full bg-white border-r-2 border-stone-100 pb-6 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">

            <div class="flex flex-col h-full overflow-y-auto">
                <!-- Header / Logo -->
                <div class="logo flex gap-1 pt-16 md:pt-4 pb-2 pl-3 items-center shrink-0">
                    <img src="/static/assets/svg/growth.svg" class="w-5 h-5" loading="lazy" alt="">
                    <p><a href="/" class="raleway-600 text-sm capitalize text-base-content">What If I Invest?</a></p>
                </div>
                <hr class="m-auto w-9/10 border-stone-200 mb-4 shrink-0">

                <!-- NAVIGATION TABS -->
                <div class="sidebar-tags grid gap-2 px-3 w-full shrink-0 mt-4">
                    <!-- Home -->
                    <a href="/" class="flex gap-3 items-center justify-start sidebar-tag btn {% if request.url.path == '/' %}btn-success btn-soft{% endif %}">
                        <div class="icon"><img src="/static/assets/svg/home.svg" class="w-5 h-5" alt=""></div>
                        <p class="capitalize raleway-400">home</p>
                    </a>

                    <!-- Saved Scenarios -->
                    <a href="/scenarios" class="flex gap-3 items-center justify-start sidebar-tag btn {% if request.url.path == '/scenarios' %}btn-success btn-soft{% endif %}">
                        <div class="icon"><img src="/static/assets/svg/save.svg" class="w-5 h-5" alt=""></div>
                        <p class="capitalize raleway-400">saved scenarios</p>
                    </a>

                    <!-- Insights -->
                    <a href="/insights" class="flex gap-3 items-center justify-start sidebar-tag btn {% if request.url.path == '/insights' %}btn-success btn-soft{% endif %}">
                        <div class="icon"><img src="/static/assets/svg/graph.svg" class="w-5 h-5" alt=""></div>
                        <p class="capitalize raleway-400">insights</p>
                    </a>

                    <!-- Settings -->
                    <a href="/settings" class="flex gap-3 items-center justify-start sidebar-tag btn {% if request.url.path == '/settings' %}btn-success btn-soft{% endif %}">
                        <div class="icon"><img src="/static/assets/svg/setting.svg" class="w-5 h-5" alt=""></div>
                        <p class="capitalize raleway-400">settings</p>
                    </a>
                </div>

                <!-- Spacer -->
                <div class="flex-1"></div>

                <!-- Bottom Message -->
                <div class="px-3 mt-auto shrink-0">
                    <div class="w-full px-2 py-4 bg-stone-100 rounded-lg text-center">
                        <p class="raleway-400 text-xs text-base-content/60">Plan. Simulate.<br>Grow your wealth.</p>
                    </div>
                </div>
            </div>
        </aside>


        <!-- 3. MAIN CONTENT AREA -->
        <section class="flex-1 h-full overflow-y-auto px-2 md:px-10 relative">
            <!-- Wrapper to push footer to the bottom -->
            <div class="pt-16 md:pt-0 w-full min-h-full flex flex-col">

                <!-- Page Content (Simulator, Scenarios, etc.) -->
                <div class="flex-1">
                    {% block content %}{% endblock %}
                </div>

                <!-- GLOBAL FOOTER -->
                <footer
                    class="mt-12 mb-4 pt-6 border-t border-base-200 text-xs text-stone-400 raleway-400 flex flex-col md:flex-row justify-between items-center gap-4">
                    <p>&copy; 2026 What If I Invest? All rights reserved.</p>
                    <div class="flex gap-6">
                        <a href="#" class="hover:text-primary transition-colors">Privacy Policy</a>
                        <a href="#" class="hover:text-primary transition-colors">Terms of Service</a>
                        <a href="/settings" class="hover:text-primary transition-colors">Settings</a>
                    </div>
                </footer>

            </div>
        </section>
    </main>


    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast toast-end toast-bottom z-[100]"></div>
    <!-- Page-Specific JS (Loads ONLY on the page that defines it) -->
    {% block scripts %}{% endblock %}
</body>

</html>
